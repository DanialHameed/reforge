# Production nginx config for ReForge.
#
# Sits in front of the FastAPI ``api`` container. Responsibilities:
#   * Terminate HTTP at the edge (TLS termination is left for the operator
#     to wire up via Certbot or a managed LB — the surface here is HTTP/80).
#   * Enforce a request-body size ceiling that matches the application's
#     own upload limits so the upstream never has to drain a 4 GB POST it
#     was always going to reject.
#   * Apply minimal hard-coded security response headers so an exposed
#     production deploy never serves without them, even if the FastAPI
#     middleware is misconfigured (defense in depth).
#   * Expose ``/health`` for upstream load balancers / Uptime monitors.
#
# Frontend hosting is intentionally NOT modeled here — the production
# Next.js build is expected to be served separately (Vercel / Cloudflare
# Pages / a sibling container the operator adds). Adding a ``location /``
# proxy is a one-line change once a real frontend upstream is decided.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Compress text response bodies (JSON, HTML, CSS) but never compress
  # video/image uploads; gzip on those wastes CPU and gains nothing.
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types
    application/json
    application/javascript
    text/css
    text/plain
    text/xml
    image/svg+xml;

  # Performance / connection management.
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  75s;
  server_tokens      off;

  # Match the application's hard cap (2 GB video uploads per app/api/v1/content.py).
  # Reject larger requests at the edge so we never proxy bytes the upstream
  # is going to refuse with HTTP 413 anyway.
  client_max_body_size 2g;

  # Long-running uploads: do not kill the connection mid-stream.
  client_body_timeout    300s;
  client_header_timeout  60s;
  proxy_connect_timeout  10s;
  proxy_send_timeout     300s;
  proxy_read_timeout     300s;
  send_timeout           60s;

  # Hide the upstream Server header.
  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;

  # Real client IP propagation (for rate-limit keys, audit logs).
  set_real_ip_from 0.0.0.0/0;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;

  # Edge rate limit for the OAuth endpoints — a single attacker should not
  # be able to brute-force the auth surface even if the FastAPI app is
  # under load. 10 req/s with 20-burst is generous for legitimate use
  # (browser retries, slow clients) but trips quickly on real abuse.
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

  upstream reforge_api {
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Defense-in-depth response headers. The FastAPI app should also set
    # these (and does in production), but keeping them at the edge means a
    # misconfigured upstream cannot accidentally serve unhardened responses.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS only takes effect over HTTPS. Operators terminating TLS at the
    # LB / Certbot may set this header at the next layer.

    # Health endpoints — expose for external probes; bypass rate limits.
    location = /health {
      proxy_pass http://reforge_api/health;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      access_log off;
    }
    location = /health/ready {
      proxy_pass http://reforge_api/health/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      access_log off;
    }

    # Auth surface gets the rate limit.
    location ~ ^/api/v1/auth/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://reforge_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api goes straight to the app.
    location /api/ {
      proxy_pass http://reforge_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }

    # OpenAPI / docs (operator convenience; safe to remove in hardened deploys).
    location ~ ^/(docs|redoc|openapi.json)$ {
      proxy_pass http://reforge_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all: refuse with 404 so unwanted paths don't leak the upstream
    # error pages. Operators wanting to host a frontend behind nginx can
    # replace this with a ``proxy_pass`` to their frontend upstream.
    location / {
      return 404;
    }
  }
}
